name: Flutter CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: lineleap-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lineleap-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release-smoke:
    needs: quality
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create disposable CI signing key
        shell: bash
        run: |
          set -euo pipefail
          signing_password="$(openssl rand -hex 24)"
          keystore_path="${RUNNER_TEMP}/lineleap-ci-release.p12"

          keytool -genkeypair -noprompt \
            -alias ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -storetype PKCS12 \
            -keystore "${keystore_path}" \
            -storepass "${signing_password}" \
            -keypass "${signing_password}" \
            -dname "CN=LineLeap CI, OU=CI, O=LineLeap, L=NA, ST=NA, C=US"

          {
            printf 'storePassword=%s\n' "${signing_password}"
            printf 'keyPassword=%s\n' "${signing_password}"
            printf 'keyAlias=ci-release\n'
            printf 'storeFile=%s\n' "${keystore_path}"
          } > android/key.properties

      - name: Build Android release bundle
        run: flutter build appbundle --release

      - name: Remove disposable signing material
        if: always()
        run: |
          rm -f android/key.properties \
            "${RUNNER_TEMP}/lineleap-ci-release.p12"
